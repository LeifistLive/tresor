# Local development: only PostgreSQL, published on localhost:5432.
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://tresor:tresor@localhost:5432/tresor npm run dev
name: tresor-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tresor
      POSTGRES_PASSWORD: tresor
      POSTGRES_DB: tresor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev-db:/var/lib/postgresql

volumes:
  dev-db:
