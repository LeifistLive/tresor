# Tresor – production stack
#   1. create .env with random secrets      (commands in README.md / docs/installation.md)
#   2. docker compose up -d                 (builds the image locally on first start)
#   3. open the app and create the admin account
#
# Tresor encrypts in the browser, which needs HTTPS (or localhost). Either put it behind your reverse proxy
# or use the bundled one:            docker compose --profile https up -d   →  https://<TRESOR_HOSTNAME>:8443
#
# Optional nightly database dumps:  docker compose --profile backup up -d
# Plus off-site copies via rclone:   docker compose --profile backup --profile offsite up -d

name: tresor

services:
  app:
    # Default: build the image from this repository. To run a published image instead set
    # TRESOR_IMAGE=ghcr.io/leifistlive/tresor:<version> and TRESOR_PULL_POLICY=missing in .env.
    image: ${TRESOR_IMAGE:-tresor:local}
    build:
      context: .
      args:
        VERSION: ${TRESOR_VERSION:-local}
    pull_policy: ${TRESOR_PULL_POLICY:-build}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tresor:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/tresor
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?Set VAULT_MASTER_KEY in .env (see docs/installation.md)}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-3}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-25}
      IMPORT_MAX_MB: ${IMPORT_MAX_MB:-200}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      NOTIFY_ALLOW_PRIVATE: ${NOTIFY_ALLOW_PRIVATE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${TRESOR_BIND:-0.0.0.0}:${TRESOR_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tresor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tresor
    volumes:
      # PostgreSQL 18 images keep their data below /var/lib/postgresql/18/docker
      - ${TRESOR_DB_PATH:-db-data}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tresor -d tresor"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  # Nightly pg_dump into ./backups (encrypted notes stay encrypted inside the dump).
  backup:
    image: postgres:18-alpine
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: tresor
      PGDATABASE: tresor
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${TRESOR_BACKUP_PATH:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "tresor-backup: every $${BACKUP_INTERVAL_HOURS}h, keeping $${BACKUP_KEEP_DAYS} days"
        while true; do
          file="/backups/tresor-$$(date +%Y-%m-%d_%H%M%S).dump"
          pg_dump --format=custom --file="$$file.partial" && mv "$$file.partial" "$$file" && echo "wrote $$file"
          find /backups -name 'tresor-*.dump' -mtime +"$${BACKUP_KEEP_DAYS}" -delete
          sleep $$(( BACKUP_INTERVAL_HOURS * 3600 ))
        done
    networks:
      - backend

  # HTTPS in front of the app with certificates from Caddy's local CA (see deploy/Caddyfile).
  #   docker compose --profile https up -d   – set TRESOR_HOSTNAME (IP or name of the server) in .env
  https:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TRESOR_HOSTNAME: ${TRESOR_HOSTNAME:-}
    ports:
      - "${TRESOR_HTTPS_BIND:-0.0.0.0}:${TRESOR_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$${TRESOR_HOSTNAME}" ] || { echo "Set TRESOR_HOSTNAME in .env (IP or host name of this server)"; exit 1; }
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    networks:
      - frontend

  # Copies the dumps to any rclone remote (S3, Backblaze B2, NAS via SFTP/SMB, WebDAV …).
  # Use an rclone "crypt" remote so the files are encrypted before they leave the house.
  #   docker compose --profile backup --profile offsite up -d
  offsite:
    image: rclone/rclone:1
    profiles: ["offsite"]
    restart: unless-stopped
    environment:
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      OFFSITE_INTERVAL_HOURS: ${OFFSITE_INTERVAL_HOURS:-24}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-60}
    volumes:
      - ${TRESOR_BACKUP_PATH:-./backups}:/backups:ro
      - ${RCLONE_CONFIG_PATH:-./rclone}:/config/rclone
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        [ -n "$${RCLONE_REMOTE}" ] || { echo "Set RCLONE_REMOTE in .env (e.g. b2crypt:tresor)"; exit 1; }
        echo "tresor-offsite: syncing to $${RCLONE_REMOTE} every $${OFFSITE_INTERVAL_HOURS}h"
        while true; do
          rclone copy /backups "$${RCLONE_REMOTE}" --include 'tresor-*.dump' --log-level INFO
          rclone delete "$${RCLONE_REMOTE}" --min-age "$${OFFSITE_KEEP_DAYS}d" --include 'tresor-*.dump' --log-level INFO || true
          sleep $$(( OFFSITE_INTERVAL_HOURS * 3600 ))
        done
    networks:
      - frontend

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  frontend:
  backend:
    internal: true
