name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please never paste secrets, recovery keys, VAULT_MASTER_KEY or database dumps into an issue.
        Security problems: see SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected and actual behaviour.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tresor version
      placeholder: "1.0.0 (shown in the sidebar)"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Unraid 7 / Docker 28 / Raspberry Pi 5 …"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs app` (redact anything sensitive).
      render: text
